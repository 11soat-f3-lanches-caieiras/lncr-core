name: Build and Publish Core JAR

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ master ]
    types: [closed]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Artifact lncr-core
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: mvn clean test -f core/pom.xml

    - name: Build JAR
      run: mvn clean package -f core/pom.xml -DskipTests

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload JAR as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: core/target/core-*.jar
        retention-days: 30

  publish:
    needs: build
    name: publish lncr-core to GitHub Packages and create Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        server-username: ${{ github.actor }}
        server-password: ${{ secrets.GITHUB_TOKEN }}
        settings-path: ${{ github.workspace }}

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up Maven settings.xml
      run: |
        mkdir -p $HOME/.m2
        echo "<settings>
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${{ secrets.GITHUB_TOKEN }}</password>
            </server>
          </servers>
        </settings>" > $HOME/.m2/settings.xml

    - name: Publish to GitHub Packages
      run: mvn deploy -f core/pom.xml -DskipTests --settings ${{ github.workspace }}/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      if: github.event.pull_request.merged == true || (github.ref == 'refs/heads/master' || github.event_name == 'release')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        release_name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release for LNCR Core version ${{ steps.get_version.outputs.version }}
          
          ## Changes
          - Build JAR: core-${{ steps.get_version.outputs.version }}.jar
          
          ## Artifacts
          - Core library JAR with all domain logic and business rules
        draft: false
        prerelease: false
      id: create_release

    - name: Upload JAR to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url || github.event.release.upload_url }}
        asset_path: core/target/core-${{ steps.get_version.outputs.version }}.jar
        asset_name: lncr-core-${{ steps.get_version.outputs.version }}.jar
        asset_content_type: application/java-archive

