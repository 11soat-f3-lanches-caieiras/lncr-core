name: Build and Publish Core JAR

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: mvn clean test -f core/pom.xml

    - name: Build JAR
      run: mvn clean package -f core/pom.xml -DskipTests

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload JAR as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: core/target/core-*.jar
        retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build JAR for release
      run: mvn clean package -f core/pom.xml -DskipTests

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release (if push to master)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        release_name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release for LNCR Core version ${{ steps.get_version.outputs.version }}
          
          ## Changes
          - Build JAR: core-${{ steps.get_version.outputs.version }}.jar
          
          ## Artifacts
          - Core library JAR with all domain logic and business rules
        draft: false
        prerelease: false
      id: create_release

    - name: Upload JAR to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url || github.event.release.upload_url }}
        asset_path: core/target/core-${{ steps.get_version.outputs.version }}.jar
        asset_name: lncr-core-${{ steps.get_version.outputs.version }}.jar
        asset_content_type: application/java-archive
