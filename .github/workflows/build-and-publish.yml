#Commit 20250916-3
name: Build and Publish Core JAR
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master ]
    types: [closed]
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para build e publish'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Build Artifact lncr-core
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: mvn clean test -f core/pom.xml

    - name: Build JAR
      run: mvn clean package -f core/pom.xml -DskipTests

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload JAR as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: core/target/core-*.jar
        retention-days: 30

  publish:
    needs: build
    name: publish lncr-core to GitHub Packages and create Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Get version from pom.xml
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f core/pom.xml)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check and delete existing package version
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        OWNER="${{ github.repository_owner }}"
        PACKAGE_NAME="br.com.tp.lncr.core"
        
        echo "Checking for existing package version: $VERSION"
        echo "Package name: $PACKAGE_NAME"
        echo "Owner: $OWNER"
        
        # Verificar se a versão existe
        echo "Fetching package versions..."
        RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions")
        
        HTTP_STATUS=$(echo $RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        BODY=$(echo $RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')
        
        echo "HTTP Status: $HTTP_STATUS"
        
        if [ "$HTTP_STATUS" -eq 200 ]; then
          # Contar quantas versões existem
          VERSION_COUNT=$(echo $BODY | jq length 2>/dev/null || echo "0")
          echo "Total versions found: $VERSION_COUNT"
          
          EXISTING_VERSION_ID=$(echo $BODY | jq -r ".[] | select(.name == \"$VERSION\") | .id" 2>/dev/null || echo "")
          
          if [ ! -z "$EXISTING_VERSION_ID" ] && [ "$EXISTING_VERSION_ID" != "null" ]; then
            echo "Found existing version $VERSION with ID: $EXISTING_VERSION_ID"
            
            # Se há apenas uma versão, deletar o pacote inteiro
            if [ "$VERSION_COUNT" -eq 1 ]; then
              echo "This is the only version. Deleting entire package..."
              
              DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME")
              
              DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
              
              if [ "$DELETE_STATUS" -eq 204 ]; then
                echo "Package $PACKAGE_NAME deleted successfully"
              else
                echo "Failed to delete package. HTTP Status: $DELETE_STATUS"
                echo "Response: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
              fi
            else
              # Se há múltiplas versões, deletar apenas a versão específica
              echo "Multiple versions exist. Deleting version $VERSION..."
              
              DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions/$EXISTING_VERSION_ID")
              
              DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
              
              if [ "$DELETE_STATUS" -eq 204 ]; then
                echo "Package version $VERSION deleted successfully"
              else
                echo "Failed to delete package version. HTTP Status: $DELETE_STATUS"
                echo "Response: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
                
                # Se falhar por ser a última versão, tentar deletar o pacote inteiro
                if [[ $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//' | grep -c "last version") -gt 0 ]]; then
                  echo "Attempting to delete entire package as fallback..."
                  
                  FALLBACK_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
                    -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME")
                  
                  FALLBACK_STATUS=$(echo $FALLBACK_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
                  
                  if [ "$FALLBACK_STATUS" -eq 204 ]; then
                    echo "Package $PACKAGE_NAME deleted successfully as fallback"
                  else
                    echo "Fallback deletion also failed. HTTP Status: $FALLBACK_STATUS"
                    echo "Continuing with deployment anyway..."
                  fi
                fi
              fi
            fi
          else
            echo "No existing package version $VERSION found"
          fi
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "Package not found (first time publishing) - continuing with deployment"
        else
          echo "Failed to fetch package versions. HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          echo "Continuing with deployment anyway..."
        fi

    - name: Validate Maven settings
      run: |
        echo "Validating Maven configuration for GitHub Packages..."
        mvn help:effective-settings -f core/pom.xml | grep -A 10 -B 10 github || true

    - name: Publish to GitHub Packages
      run: mvn deploy -f core/pom.xml -DskipTests
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download built artifact
      uses: actions/download-artifact@v4
      with:
        name: lncr-core-${{ steps.get_version.outputs.version }}
        path: ./artifacts

    - name: Check and delete existing release
      if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        TAG_NAME="v$VERSION"
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        
        echo "Checking for existing release: $TAG_NAME"
        echo "Repository: $OWNER/$REPO"
        
        # Verificar se a release existe
        echo "Fetching release information..."
        RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG_NAME")
        
        HTTP_STATUS=$(echo $RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        BODY=$(echo $RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')
        
        echo "HTTP Status: $HTTP_STATUS"
        
        if [ "$HTTP_STATUS" -eq 200 ]; then
          RELEASE_ID=$(echo $BODY | jq -r '.id' 2>/dev/null || echo "")
          
          if [ ! -z "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Found existing release $TAG_NAME with ID: $RELEASE_ID"
            echo "Deleting existing release..."
            
            DELETE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")
            
            DELETE_STATUS=$(echo $DELETE_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
            
            if [ "$DELETE_STATUS" -eq 204 ]; then
              echo "Release $TAG_NAME deleted successfully"
            else
              echo "Failed to delete release. HTTP Status: $DELETE_STATUS"
              echo "Response: $(echo $DELETE_RESPONSE | sed -E 's/HTTP_STATUS:[0-9]{3}$//')"
            fi
          else
            echo "No existing release $TAG_NAME found"
          fi
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "Release not found (first time creating) - continuing with release creation"
        else
          echo "Failed to fetch release information. HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          echo "Continuing with release creation anyway..."
        fi
        
        # Verificar e deletar tag existente
        echo "Checking for existing tag: $TAG_NAME"
        TAG_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$OWNER/$REPO/git/refs/tags/$TAG_NAME")
        
        TAG_HTTP_STATUS=$(echo $TAG_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
        
        if [ "$TAG_HTTP_STATUS" -eq 200 ]; then
          echo "Found existing tag $TAG_NAME - deleting..."
          
          DELETE_TAG_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$OWNER/$REPO/git/refs/tags/$TAG_NAME")
          
          DELETE_TAG_STATUS=$(echo $DELETE_TAG_RESPONSE | sed -E 's/.*HTTP_STATUS:([0-9]{3})$/\1/')
          
          if [ "$DELETE_TAG_STATUS" -eq 204 ]; then
            echo "Tag $TAG_NAME deleted successfully"
          else
            echo "Failed to delete tag. HTTP Status: $DELETE_TAG_STATUS"
          fi
        elif [ "$TAG_HTTP_STATUS" -eq 404 ]; then
          echo "Tag not found - continuing with release creation"
        fi

    - name: Create Release
      if: github.event.pull_request.merged == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release for LNCR Core version ${{ steps.get_version.outputs.version }}
          
          ## Changes
          - Build JAR: core-${{ steps.get_version.outputs.version }}.jar
          
          ## Artifacts
          - Core library JAR with all domain logic and business rules
        draft: false
        prerelease: false
        files: |
          ./artifacts/core-*.jar
        token: ${{ secrets.GITHUB_TOKEN }}
